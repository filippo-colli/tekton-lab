apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tekton-lab
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/filippo-colli/tekton-lab.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
