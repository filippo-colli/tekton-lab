apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: update-snapshot-version-task
  namespace: default

spec:

  workspaces:
    - name: source

  steps:

    - name: update-version

      image: maven:3.9.11-eclipse-temurin-21

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -e

        echo "Versione corrente:"
        ./mvnw help:evaluate \
          -Dexpression=project.version \
          -q \
          -DforceStdout

        echo "Incremento versione SNAPSHOT"

        ./mvnw versions:set \
          -DnextSnapshot=true \
          -DgenerateBackupPoms=false

        echo "Nuova versione:"
        ./mvnw help:evaluate \
          -Dexpression=project.version \
          -q \
          -DforceStdout
