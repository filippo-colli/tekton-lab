apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: update-image-version-task
  namespace: default

spec:

  workspaces:
    - name: source

  steps:

    - name: update-image

      image: maven:3.9.11-eclipse-temurin-21

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -e

        echo "================================="
        echo "Aggiornamento immagine Kubernetes"
        echo "================================="


        chmod +x ./mvnw


        IMAGE=$(./mvnw help:evaluate \
          -Dexpression=docker.image \
          -q \
          -DforceStdout 2>/dev/null | grep -E '^[a-zA-Z0-9._/-]+$' | tail -1)


        VERSION=$(./mvnw help:evaluate \
          -Dexpression=project.version \
          -q \
          -DforceStdout 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+.*' | tail -1)


        if [ -z "$IMAGE" ]; then
          echo "ERRORE: immagine Docker non trovata"
          exit 1
        fi


        if [ -z "$VERSION" ]; then
          echo "ERRORE: versione Maven non trovata"
          exit 1
        fi


        FULL_IMAGE="${IMAGE}:${VERSION}"


        echo "Immagine finale:"
        echo "$FULL_IMAGE"


        if [ ! -f k8s/deployment.yaml ]; then
          echo "ERRORE deployment.yaml non trovato"
          exit 1
        fi


        sed -i "s|image:.*|image: ${FULL_IMAGE}|g" k8s/deployment.yaml


        echo "================================="
        echo "deployment.yaml aggiornato"
        echo "================================="


        cat k8s/deployment.yaml
