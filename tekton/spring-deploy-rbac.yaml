apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spring-deploy-role
  namespace: default

rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spring-deploy-rolebinding
  namespace: default

subjects:
  - kind: ServiceAccount
    name: spring-deployer
    namespace: default

roleRef:
  kind: Role
  name: spring-deploy-role
  apiGroup: rbac.authorization.k8s.io
