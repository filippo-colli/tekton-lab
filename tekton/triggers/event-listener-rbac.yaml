apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-role
  namespace: default

rules:

- apiGroups:
    - ""
  resources:
    - secrets
    - configmaps
  verbs:
    - get
    - list
    - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-binding
  namespace: default

subjects:

- kind: ServiceAccount
  name: tekton-triggers-sa
  namespace: default

roleRef:

  kind: Role
  name: tekton-triggers-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-triggers-cluster-role

rules:

- apiGroups:
    - tekton.dev
  resources:
    - pipelineruns
    - pipelines
    - tasks
    - taskruns
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-cluster-binding

subjects:

- kind: ServiceAccount
  name: tekton-triggers-sa
  namespace: default

roleRef:

  kind: ClusterRole
  name: tekton-triggers-cluster-role
  apiGroup: rbac.authorization.k8s.io
