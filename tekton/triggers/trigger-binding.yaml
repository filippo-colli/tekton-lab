apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding

metadata:
  name: github-binding
  namespace: default

spec:

  params:

    - name: repo-url
      value: $(body.repository.clone_url)

    - name: git-revision
      value: $(body.after)

    - name: branch
      value: $(body.ref)

    - name: commit-message
      value: $(body.head_commit.message)
