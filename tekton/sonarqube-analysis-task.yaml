apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: sonarqube-analysis-task
  namespace: default

spec:

  workspaces:
    - name: source

  steps:

    - name: sonar-analysis

      image: maven:3.9.11-eclipse-temurin-21

      workingDir: $(workspaces.source.path)

      env:
        - name: SONAR_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonarqube-token
              key: token

      script: |
        #!/bin/sh
        set -e

        echo "Avvio analisi SonarQube"

        chmod +x ./mvnw

        ./mvnw sonar:sonar \
          -Dsonar.host.url=http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000 \
          -Dsonar.token=$SONAR_TOKEN

        echo "Analisi SonarQube completata"
