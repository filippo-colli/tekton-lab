apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: url
      type: string

  workspaces:
    - name: output

  steps:
    - name: clone
      image: alpine/git:v2.43.0
      script: |
        #!/bin/sh
        rm -rf $(workspaces.output.path)/*
        git clone $(params.url) $(workspaces.output.path)