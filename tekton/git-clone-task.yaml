apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: git-clone-task
  namespace: default

spec:

  params:
    - name: repo-url
      type: string

  workspaces:
    - name: output

  steps:
    - name: clone

      image: alpine/git:2.43.0

      script: |
        #!/bin/sh
        set -e

        echo "Cleaning workspace..."
        rm -rf $(workspaces.output.path)/*

        echo "Cloning repository..."
        git clone $(params.repo-url) $(workspaces.output.path)

        echo "Repository cloned."

        ls -la $(workspaces.output.path)
