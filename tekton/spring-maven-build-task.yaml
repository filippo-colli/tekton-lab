apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: spring-maven-build-task

spec:
  workspaces:
    - name: source

  steps:
    - name: build
      image: eclipse-temurin:21-jdk
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -ex

        chmod +x ./mvnw

        ./mvnw clean package -DskipTests

        echo "Build completata"
        ls -la target